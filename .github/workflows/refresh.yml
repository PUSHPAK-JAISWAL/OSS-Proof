name: Refresh certificates

# Re-grades the oldest certificates every day so badges stay current without anyone touching their README.
# The badge link never changes: the same file is rewritten.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: How many certificates to refresh (1 to 300)
        default: "100"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: echo "RUN_START=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Re-grade the oldest certificates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          CERT_SIGNING_KEY: ${{ secrets.CERT_SIGNING_KEY }}
          BATCH: ${{ inputs.batch || '100' }}
          COOLDOWN_MS: "0"
        run: |
          for LOGIN in $(node scripts/pick-stale.mjs); do
            echo "::group::$LOGIN"
            LOGIN="$LOGIN" node scripts/certify.mjs && echo "refreshed $LOGIN" && { echo "::endgroup::"; continue; }
            RC=$?
            # Exit code 75 means GitHub's rate limit: stop here and keep the rest for tomorrow.
            if [ "$RC" = "75" ]; then echo "::endgroup::"; echo "Rate limit reached, stopping early."; break; fi
            node scripts/mark-failed.mjs "$LOGIN"; echo "skipped $LOGIN"
            echo "::endgroup::"
          done

      - name: Commit refreshed certificates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          MESSAGE: Refresh certificates
        run: node scripts/commit.mjs
