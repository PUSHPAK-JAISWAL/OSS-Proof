name: Refresh certificates

# Re-grades the oldest certificates every day so badges stay current without anyone touching their README.
# The badge link never changes: the same file is rewritten.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: How many certificates to refresh (1 to 60)
        default: "25"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: echo "RUN_START=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Re-grade the oldest certificates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERT_SIGNING_KEY: ${{ secrets.CERT_SIGNING_KEY }}
          BATCH: ${{ inputs.batch || '25' }}
          COOLDOWN_MS: "0"
        run: |
          for LOGIN in $(node scripts/pick-stale.mjs); do
            echo "::group::$LOGIN"
            if LOGIN="$LOGIN" node scripts/certify.mjs; then echo "refreshed $LOGIN"; else node scripts/mark-failed.mjs "$LOGIN"; echo "skipped $LOGIN"; fi
            echo "::endgroup::"
          done

      - name: Commit refreshed certificates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          MESSAGE: Refresh certificates
        run: node scripts/commit.mjs
