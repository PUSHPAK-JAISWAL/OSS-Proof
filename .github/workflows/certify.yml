name: Issue certificate

# Runs when someone opens a "Certificate request" issue. The issue author is the account being graded.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  # Answers at once, outside the queue, so nobody wonders whether the request arrived.
  acknowledge:
    if: startsWith(github.event.issue.title, 'Certificate request')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Say we got it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          printf 'Request received for @%s.\n\nRequests go through the GitHub Actions queue, so this can take a few minutes when many people ask at once. This comment thread will get your README tags as soon as the certificate is ready. You do not need to do anything else.\n' "$LOGIN" > ack.md
          gh issue comment "$NUMBER" --repo "$REPO" --body-file ack.md

  certify:
    if: startsWith(github.event.issue.title, 'Certificate request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: echo "RUN_START=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Grade and sign
        id: cert
        env:
          # Passed as environment variables, never pasted into the script, so issue text cannot inject commands.
          LOGIN: ${{ github.event.issue.user.login }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          CERT_SIGNING_KEY: ${{ secrets.CERT_SIGNING_KEY }}
          APP_ID: ${{ vars.GH_APP_ID || secrets.GH_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          APP_SLUG: ${{ vars.GH_APP_SLUG || secrets.GH_APP_SLUG }}
        run: node scripts/certify.mjs
        continue-on-error: true

      - name: Commit certificate
        id: commit
        continue-on-error: true
        if: steps.cert.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          MESSAGE: Certificate for ${{ steps.cert.outputs.file }}
        run: node scripts/commit.mjs

      - name: Reply on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          NUMBER: ${{ github.event.issue.number }}
          RESTRICTED: ${{ steps.cert.outputs.restricted }}
          STORE: ${{ steps.cert.outputs.store }}
          NOTE: ${{ steps.cert.outputs.note }}
          APP_SLUG: ${{ vars.GH_APP_SLUG || secrets.GH_APP_SLUG }}
          STATUS: ${{ steps.commit.outcome == 'failure' && 'failed' || steps.cert.outputs.status }}
          GRADE: ${{ steps.cert.outputs.grade }}
          SCORE: ${{ steps.cert.outputs.score }}
          FILE: ${{ steps.cert.outputs.file }}
          LOGIN: ${{ github.event.issue.user.login }}
          MESSAGE: ${{ steps.cert.outputs.message || 'Saving the certificate to the repository failed. Check that Settings > Actions > General > Workflow permissions is set to Read and write.' }}
        run: |
          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          SITE="https://${OWNER,,}.github.io/${NAME}/"
          if [ "$STATUS" = "ok" ] || [ "$STATUS" = "recent" ]; then
            F="${FILE:-${LOGIN,,}}"
            if [ "$STORE" = "profile" ]; then
              RAW="https://raw.githubusercontent.com/${LOGIN}/${LOGIN}/HEAD/.oss-proof"; BIG="badge.svg"; MINI="badge-mini.svg"; TH="badge"
            else
              RAW="https://raw.githubusercontent.com/${REPO}/${BRANCH}/data/badges"; BIG="${F}.svg"; MINI="${F}-mini.svg"; TH="${F}"
            fi
            LINK="${SITE}#/verify/${LOGIN}"
            {
              if [ "$STATUS" = "ok" ]; then echo "Certificate ready: grade **$GRADE**, score **$SCORE**."; else echo "A certificate was issued less than an hour ago, so it was kept."; fi
              if [ -n "$RESTRICTED" ]; then echo; echo "> **Heads up:** some pull requests in these organizations could not be read because they block this token: $RESTRICTED. Your grade may be a little low. It is re-graded automatically and will correct itself once the maintainer fixes the token."; fi
              echo
              echo "Certificate page: ${LINK}"
              echo
              echo "Copy one of these into your profile README (the repository named \`${LOGIN}/${LOGIN}\`):"
              echo
              echo "**Card badge, Markdown**"
              echo '```markdown'
              echo "[![OSS Proof](${RAW}/${BIG})](${LINK})"
              echo '```'
              echo "**Compact badge, Markdown**"
              echo '```markdown'
              echo "[![OSS Proof](${RAW}/${MINI})](${LINK})"
              echo '```'
              echo "**Card badge, HTML**"
              echo '```html'
              echo "<a href=\"${LINK}\"><img src=\"${RAW}/${BIG}\" alt=\"OSS Proof\" width=\"380\" /></a>"
              echo '```'
              echo
              echo "**Other themes** (change the file name in the link): \`${TH}.midnight.svg\`, \`${TH}.aurora.svg\`, \`${TH}.sunset.svg\`, \`${TH}.terminal.svg\`, \`${TH}.neon.svg\`, \`${TH}.glass.svg\`, \`${TH}.paper.svg\`. Preview them on your certificate page."
              if [ "$STORE" = "profile" ]; then
                echo
                echo "Your certificate and badges are stored in your own repository, \`${LOGIN}/${LOGIN}\`, in the \`.oss-proof\` folder, written by the OSS Proof app."
              elif [ -n "$APP_SLUG" ]; then
                case "$NOTE" in
                  not-installed) echo; echo "**Optional:** keep your certificate and badges in your own profile repository instead. Install the OSS Proof app on \`${LOGIN}/${LOGIN}\` only: https://github.com/apps/${APP_SLUG}/installations/new . Then ask for a new certificate." ;;
                  repo-not-granted) echo; echo "The OSS Proof app is installed but cannot reach \`${LOGIN}/${LOGIN}\`. Add that repository in the app's settings, then ask for a new certificate." ;;
                  write-failed) echo; echo "The app could not write to \`${LOGIN}/${LOGIN}\`. Check that it exists, is public and has a README, then ask again." ;;
                esac
              fi
              echo
              echo "The badge can take a minute to appear because GitHub caches images. Ask for a new certificate any time your work changes (once an hour at most)."
            } > reply.md
            gh issue comment "$NUMBER" --repo "$REPO" --body-file reply.md
            gh issue close "$NUMBER" --repo "$REPO" --reason completed
          else
            printf 'The certificate could not be created.\n\n%s\n' "${MESSAGE:-See the workflow run for details.}" > reply.md
            gh issue comment "$NUMBER" --repo "$REPO" --body-file reply.md
            gh issue close "$NUMBER" --repo "$REPO" --reason "not planned"
          fi
