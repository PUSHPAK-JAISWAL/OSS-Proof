name: Bug report
description: Something is broken or shows the wrong result.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page or link
      placeholder: https://pushpak-jaiswal.github.io/OSS-Proof/#/check/octocat
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: browser
    attributes:
      label: Browser and device
