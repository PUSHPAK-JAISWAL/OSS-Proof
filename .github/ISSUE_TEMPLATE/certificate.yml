name: Certificate request
description: Get a signed OSS Proof certificate for the GitHub account you are signed in with.
title: "Certificate request"
labels: ["certificate"]
body:
  - type: markdown
    attributes:
      value: |
        A workflow grades **the account that opens this issue**. GitHub itself proves who you are, so there is nothing to paste.

        It reads your public pull requests, writes a signed certificate and a badge into this repository, comments with your links, and closes the issue. This takes a minute or two.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: I am requesting a certificate for my own account and I understand it is built from public GitHub data.
          required: true
